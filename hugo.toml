baseURL = "https://danilomarroco.github.io/meu-blog/"
languageCode = "pt-br"
title = "Meu Blog Pessoal"
defaultContentLanguage = "pt-br"

theme = "ananke"

# Main sections for recent posts display
mainSections = ["posts"]

enableRobotsTXT = true
hasCJKLanguage = false

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[taxonomy]
  category = "categories"
  tag = "tags"

[privacy]
  [privacy.x]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true
